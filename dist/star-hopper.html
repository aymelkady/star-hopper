<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Star Hopper">
<meta name="theme-color" content="#3d8ef0">
<title>Star Hopper</title>
<style>
/* Star Hopper base styles. Min text 20 px, high contrast, icon + text (R9). Stable ids for other agents. */
:root {
  --ink: #1d1530; --paper: #fffaf0; --chip: rgba(24, 18, 46, 0.82); --chip-ink: #ffffff;
  --gold: #ffd84a; --red: #ff4f5e; --accent: #ff8a1f; --good: #2fd35a; --blue: #3a7bff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px); --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-l: env(safe-area-inset-left, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd8ff; color: var(--ink);
  font: 600 22px/1.25 var(--font); overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; touch-action: none; z-index: 10; }
#hud[hidden] { display: none; }
.hud-left { position: absolute; top: calc(12px + var(--safe-t)); left: calc(12px + var(--safe-l)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.chip { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 16px 6px 10px; border-radius: 999px;
  background: var(--chip); color: var(--chip-ink); font-size: 24px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.chip[hidden] { display: none; }
.chip .ico { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 24px; line-height: 1; }
.ico.star { color: var(--gold); }
.ico.coin { background: radial-gradient(circle at 35% 35%, #fff3a8, var(--gold) 55%, #c8901a); border: 2px solid #8a5c00; }
.ico.redcoin { background: radial-gradient(circle at 35% 35%, #ffc2c8, var(--red) 55%, #a01020); border: 2px solid #6a0010; }
.chip.zone { font-size: 20px; padding-left: 16px; }
.chip.pulse { animation: pulse .35s ease-out; }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.hud-right { position: absolute; top: calc(12px + var(--safe-t)); right: calc(12px + var(--safe-r)); display: flex; gap: 12px; pointer-events: auto; }
.icon-btn { width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); background: var(--chip); color: #fff;
  display: grid; place-items: center; cursor: pointer; padding: 0; touch-action: manipulation; }
.icon-btn svg { width: 28px; height: 28px; fill: currentColor; }
.icon-btn:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

#quest-card { position: fixed; top: calc(12px + var(--safe-t)); left: 50%; transform: translateX(-50%); z-index: 11; pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(26% + var(--safe-b)); transform: translateX(-50%) translateY(20px); z-index: 12; pointer-events: none;
  background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 18px; padding: 10px 22px; font-size: 26px; font-weight: 800;
  opacity: 0; transition: opacity .18s, transform .18s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .18s linear; z-index: 30; }
#fade.on { opacity: 1; }

/* ---------- quest card (systems/objectives.js + ui/quest-card.js) ---------- */
:root { --qc-side: 236px; }
#quest-card { width: max-content; max-width: min(560px, calc(100vw - 2 * var(--qc-side))); }
#quest-card[hidden] { display: none; }
#quest-card > div { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 rgba(0,0,0,.28); }
.qc-obj { padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
.qc-obj[hidden], .qc-cele[hidden], .qc-intro[hidden] { display: none; }
.qc-main { display: flex; align-items: center; gap: 10px; justify-content: center; }
.qc-ico { font-size: 32px; line-height: 1; flex: none; }
.qc-text { font-size: 25px; font-weight: 900; line-height: 1.1; }
.qc-sub { display: flex; align-items: center; gap: 10px; }
.qc-bar { flex: 1 1 90px; min-width: 70px; height: 14px; border-radius: 999px; background: #e9dfc9; border: 2px solid var(--ink); overflow: hidden; }
.qc-bar[hidden] { display: none; }
.qc-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb020, var(--gold)); border-radius: 999px; transition: width .3s; }
.qc-dist { font-size: 20px; font-weight: 800; background: var(--ink); color: #fff; border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
.qc-dist[hidden] { display: none; }
.qc-dots { display: inline-flex; gap: 5px; }
.qc-dots[hidden] { display: none; }
.qc-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
.qc-dots i.on { background: var(--gold); }
.qc-dots i.cur { box-shadow: 0 0 0 3px var(--blue); }
.qc-skip { margin-left: auto; pointer-events: auto; touch-action: manipulation; font: 800 20px/1 var(--font); min-height: 44px; min-width: 76px; padding: 0 14px;
  border: 3px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
.qc-skip[hidden] { display: none; }
.qc-skip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.qc-skip:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
#quest-card > .qc-cele { background: var(--gold); padding: 12px 26px; text-align: center; animation: qc-pop .45s cubic-bezier(.2,1.6,.4,1); }
.qc-cele-big { font-size: 34px; font-weight: 900; line-height: 1.1; white-space: nowrap; }
.qc-cele-sub { font-size: 21px; font-weight: 800; margin-top: 2px; }
@keyframes qc-pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
#quest-card > .qc-intro { padding: 12px 20px 10px; pointer-events: auto; cursor: pointer; text-align: left; }
.qc-intro-h { font-size: 26px; font-weight: 900; text-align: center; color: var(--accent); text-shadow: 0 2px 0 var(--ink); }
.qc-rows { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.qc-rows li { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; padding: 4px 10px; border-radius: 12px; }
.qc-rows li.cur { background: #fff1b8; border: 3px solid var(--ink); }
.qc-rows li.done { opacity: .7; text-decoration: line-through; }
.qr-now { margin-left: auto; color: #1d4fc4; font-size: 20px; }
.qc-intro-tap { text-align: center; font-size: 20px; font-weight: 800; color: #5a4a6a; }

/* ---------- break timer chip (systems/breaks.js) ---------- */
.break-ring { gap: 8px; }
.break-ring[hidden] { display: none; }
.break-ring.desk { position: absolute; left: calc(12px + var(--safe-l)); bottom: calc(12px + var(--safe-b)); }
.break-ring .ring { width: 34px; height: 34px; flex: none; }
.ring .rb { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 8; }
.ring .rf { fill: none; stroke: var(--good); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
.break-ring .ring-lbl { font-size: 20px; margin-left: -4px; }
.break-ring[data-level="amber"] .rf { stroke: #ffb020; } .break-ring[data-level="amber"] { color: #ffd27a; }
.break-ring[data-level="red"] .rf { stroke: #ff5a66; } .break-ring[data-level="red"] { color: #ffb3b9; box-shadow: 0 0 0 3px #ff5a66, 0 3px 0 rgba(0,0,0,.25); }
.break-ring.flash { animation: pulse .5s ease-out 3; }

/* ---------- focus mode (systems/focus.js) ---------- */
#focus-vignette { position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(ellipse 46% 52% at 50% 58%, rgba(10,8,30,0) 40%, rgba(10,8,30,.55) 78%, rgba(10,8,30,.82) 100%); }
#focus-vignette.on { opacity: 1; }
body.focus-on #hud-coins, body.focus-on #hud-zone, body.focus-on #hud-redcoins { display: none; }
#btn-focus.active { background: var(--gold); color: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 4px var(--gold); }

/* ---------- menus ---------- */
#overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l)); }
#overlay:empty { display: none; }
#overlay.dim { background: rgba(20, 14, 40, .55); }
.menu { background: var(--paper); border: 5px solid var(--ink); border-radius: 28px; padding: 26px 30px; min-width: min(460px, 92vw); max-width: 92vw;
  max-height: 100%; overflow: auto; box-shadow: 0 10px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 14px; align-items: stretch; text-align: center; }
.menu h1 { margin: 0; font-size: clamp(44px, 9vw, 84px); line-height: 1; color: var(--accent); letter-spacing: 1px;
  text-shadow: 0 4px 0 var(--ink), 0 -2px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink); }
.menu h2 { margin: 0 0 4px; font-size: 32px; }
.menu .tag { margin: 0; font-size: 24px; }
.menu.title { background: rgba(255, 250, 240, .92); }
.btn { font: 800 26px/1 var(--font); min-height: 64px; padding: 14px 22px; border-radius: 18px; border: 4px solid var(--ink); background: #fff; color: var(--ink);
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 5px 0 var(--ink); touch-action: manipulation; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible, .btn.focus { outline: 5px solid var(--blue); outline-offset: 3px; }
.btn.big { font-size: 34px; min-height: 80px; background: var(--good); color: #062a10; }
.btn.primary { background: var(--gold); }
.slot-row { display: flex; gap: 10px; align-items: stretch; }
.slot-row .btn.slot { flex: 1; flex-direction: column; gap: 6px; }
.slot .meta { font-size: 21px; font-weight: 700; }
.btn.small { font-size: 20px; min-height: 64px; padding: 8px 14px; background: #ffe0e0; }
.controls-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 14px; text-align: left; font-size: 21px; align-items: center; }
.controls-grid .h { font-weight: 900; }
kbd { display: inline-block; min-width: 34px; padding: 2px 8px; border: 3px solid var(--ink); border-radius: 8px; background: #fff; font: 800 20px/1.2 var(--font); text-align: center; }
.notice { font-size: 21px; color: #7a1020; }

/* title screen */
.menu.title { max-width: min(760px, 94vw); }
.title-body { display: flex; flex-direction: column; gap: 12px; }
.btn .meta { font-size: 21px; font-weight: 800; opacity: .9; }
.slot-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { font: 800 20px/1.1 var(--font); color: var(--ink); background: #fff; border: 4px solid var(--ink); border-radius: 18px; padding: 8px 6px; min-height: 64px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; box-shadow: 0 4px 0 var(--ink); touch-action: manipulation; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.tile:focus-visible { outline: 5px solid var(--blue); outline-offset: 3px; }
.tile.empty { background: #f3eee4; border-style: dashed; }
.tile.empty .pip-ico { opacity: .45; filter: grayscale(.8); }
.tile-meta .star { color: #c98a00; }
.pip-ico { width: 40px; height: 40px; flex: none; }
.slot .pip-ico { width: 46px; height: 46px; }
.slot-row .btn.slot { flex-direction: row; justify-content: flex-start; }
.slot-text { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.title-row { display: flex; gap: 10px; }
.title-row > .btn:first-child { flex: 1; }
.title-extra { display: contents; }
.btn.icon-only { min-width: 64px; padding: 0 16px; font-size: 30px; }
/* pause */
.menu.pause { min-width: min(560px, 92vw); }
.pause-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.pause-grid .btn { font-size: 21px; padding: 10px 8px; gap: 6px; }
/* controls */
.controls-grid.touch { grid-template-columns: auto 1fr; }
.controls-grid .act { font-weight: 900; white-space: nowrap; }
/* settings (ui/settings.js) */
.menu.settings { width: min(1040px, 96vw); max-width: 96vw; text-align: left; padding-top: 0; }
.set-top { position: sticky; top: 0; z-index: 1; background: var(--paper); display: flex; align-items: center; gap: 16px; padding: 14px 0 8px; }
.set-top h2 { margin: 0; }
.set-top .btn { min-height: 56px; }
.set-list { display: grid; grid-template-columns: 1fr; gap: 0 28px; }
@media (min-width: 760px) { .set-list { grid-template-columns: 1fr 1fr; } }
.set-col { display: flex; flex-direction: column; gap: 8px; }
.set-head { margin: 10px 0 2px; font-size: 22px; font-weight: 900; color: #5a3a8a; border-bottom: 3px solid #e3d8c4; padding-bottom: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.set-label { font-size: 21px; font-weight: 800; min-width: 0; }
.seg { display: inline-flex; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; background: #fff; flex: none; }
.seg-btn { font: 800 20px/1 var(--font); min-height: 48px; min-width: 52px; padding: 0 12px; border: 0; border-left: 3px solid var(--ink); background: #fff; color: var(--ink);
  cursor: pointer; touch-action: manipulation; }
.seg-btn:first-child { border-left: 0; }
.seg-btn.on { background: var(--good); color: #062a10; }
.seg-btn:focus-visible { outline: 4px solid var(--blue); outline-offset: -4px; }
.slide { display: flex; align-items: center; gap: 10px; flex: 0 1 260px; }
.slide output { font-size: 20px; font-weight: 900; min-width: 44px; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; min-width: 120px; height: 48px; background: transparent; touch-action: pan-x; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 14px; border-radius: 999px; background: #e9dfc9; border: 3px solid var(--ink); }
input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: #e9dfc9; border: 3px solid var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; margin-top: -16px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); }
input[type=range]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); border: 4px solid var(--ink); }
input[type=range]:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; border-radius: 12px; }
/* stretch break (systems/breaks.js) */
.menu.stretch { min-width: min(680px, 94vw); background: #eafff0; }
.menu.stretch h2 { font-size: 36px; color: #0d5a26; }
.stretch-body { display: flex; align-items: center; justify-content: center; gap: 26px; }
.stretch-ring { position: relative; width: 150px; height: 150px; flex: none; display: grid; place-items: center; }
.stretch-ring .ring { position: absolute; inset: 0; width: 100%; height: 100%; }
.stretch-ring .ring .rb { stroke: #cfe9d6; }
.stretch-ring .ring-num { font-size: 48px; font-weight: 900; line-height: 1; margin-top: -14px; }
.stretch-ring .ring-lbl { position: absolute; bottom: 36px; font-size: 20px; font-weight: 800; }
.stretch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.stretch-list li { font-size: 24px; font-weight: 800; padding: 8px 14px; border-radius: 14px; border: 3px solid transparent; }
.stretch-list li.cur { background: #fff; border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.stretch-btns { display: flex; gap: 12px; justify-content: center; }
.stretch-btns .btn { flex: 1; } .stretch-btns .btn[hidden] { display: none; }
/* great session (systems/objectives.js) */
.menu.great { background: #fff6d6; }
.great-burst { font-size: 72px; line-height: 1; animation: qc-pop .6s cubic-bezier(.2,1.6,.4,1); }
.menu.great h2 { font-size: 40px; color: var(--accent); text-shadow: 0 3px 0 var(--ink); }
.great-stars { margin: 0; font-size: 40px; }

/* ---------- touch controls ---------- */
#touch-controls { position: fixed; inset: 0; z-index: 9; touch-action: none; }
#touch-controls[hidden] { display: none; }
.stick { position: absolute; width: 0; height: 0; pointer-events: none; }
.stick[hidden] { display: none; }
.stick .base { position: absolute; width: 96px; height: 96px; left: -48px; top: -48px; border-radius: 50%; border: 4px solid rgba(255,255,255,.75); background: rgba(24,18,46,.28); }
.stick .knob { position: absolute; left: 0; top: 0; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.85); border: 3px solid var(--ink); transform: translate(-50%,-50%); }
.touch-buttons { position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(18px + var(--safe-b)); width: 236px; height: 200px; }
.tbtn { position: absolute; width: 76px; height: 76px; border-radius: 50%; border: 4px solid rgba(255,255,255,.95); color: #fff; font: 900 26px/1 var(--font);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; opacity: .82; touch-action: none; padding: 0; }
.tbtn small { font-size: 13px; font-weight: 800; letter-spacing: .3px; }
.tbtn.down { transform: scale(.92); opacity: 1; }
.tb-a { right: 0; bottom: 0; width: 92px; height: 92px; background: #2fbf55; font-size: 32px; }
.tb-b { right: 104px; bottom: 6px; background: #e8473f; }
.tb-x { right: 24px; bottom: 106px; background: #3a7bff; }
#rotate-hint { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
  #rotate-hint.show { display: block; position: fixed; left: 50%; bottom: calc(240px + var(--safe-b)); transform: translateX(-50%); z-index: 8; pointer-events: none;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 8px 14px; font-size: 20px; white-space: nowrap; }
}
@media (max-height: 430px) {
  .chip { min-height: 38px; font-size: 21px; padding: 4px 12px 4px 8px; }
  .chip .ico { width: 26px; height: 26px; font-size: 21px; }
  .hud-left { gap: 6px; }
  .menu { padding: 16px 20px; gap: 10px; }
  .btn { min-height: 64px; font-size: 22px; } .btn.big { min-height: 66px; font-size: 28px; }
  .menu h1 { font-size: 48px; }
}
@media (max-height: 430px) {
  :root { --qc-side: 214px; }
  .qc-obj { padding: 5px 12px 7px; gap: 4px; }
  .qc-text { font-size: 21px; } .qc-ico { font-size: 26px; }
  .qc-cele-big { font-size: 28px; }
  .qc-rows li { font-size: 20px; padding: 2px 8px; } .qc-intro-h { font-size: 22px; }
  .menu.title { flex-direction: row; align-items: center; gap: 22px; text-align: center; }
  .title-head { flex: 0 0 34%; } .title-body { flex: 1; gap: 10px; }
  .tile { min-height: 60px; padding: 4px; } .pip-ico { width: 32px; height: 32px; }
  .set-top { padding: 10px 0 6px; } .set-row { min-height: 50px; gap: 8px; } .set-head { margin-top: 6px; }
  .set-label { font-size: 20px; } .seg-btn { padding: 0 9px; min-width: 46px; }
  .controls-grid.touch { grid-template-columns: auto 1fr auto 1fr; gap: 6px 12px; font-size: 20px; }
  .controls-grid.touch .h { display: none; }
  .menu.controls h2 { font-size: 26px; }
  .stretch-ring { width: 124px; height: 124px; } .stretch-ring .ring-num { font-size: 40px; } .stretch-ring .ring-lbl { bottom: 28px; }
  .stretch-list li { font-size: 21px; padding: 4px 12px; } .menu.stretch h2 { font-size: 28px; }
  .great-burst { font-size: 48px; } .menu.great h2 { font-size: 32px; } .great-stars { font-size: 30px; }
}
@media (max-width: 600px) { /* portrait phones: card sits below the right-hand buttons */
  #quest-card { left: auto; right: calc(12px + var(--safe-r)); transform: none; top: calc(80px + var(--safe-t)); max-width: calc(100vw - 200px); }
}
@media (prefers-reduced-motion: reduce) {
  .chip.pulse, .break-ring.flash, #quest-card > .qc-cele, .great-burst { animation: none; }
  #toast, #fade, #focus-vignette, .qc-bar i, .ring .rf { transition: none; }
}
html.reduce-motion .chip.pulse, html.reduce-motion .break-ring.flash, html.reduce-motion #quest-card > .qc-cele, html.reduce-motion .great-burst { animation: none; }
html.reduce-motion #toast, html.reduce-motion .qc-bar i, html.reduce-motion .ring .rf { transition: none; }

</style>
</head>
<body>
<canvas id="game" tabindex="-1" aria-label="Star Hopper game view"></canvas>
<div id="hud" hidden>
  <div class="hud-left">

#touch-controls { position: fixed; inset: 0; z-index: 9; touch-action: none; -webkit-user-select: none; user-select: none; }
#touch-controls[hidden] { display: none; }
#gs-stick { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .18s ease-out; }
#gs-stick.on { opacity: .4; transition-duration: .06s; }
#gs-stick .gs-ring { position: absolute; width: ${mt.STICK_RING}px; height: ${mt.STICK_RING}px; left: -${mt.STICK_RING/2}px; top: -${mt.STICK_RING/2}px;
  border-radius: 50%; border: 3px solid #fff; background: rgba(255,255,255,.12); box-sizing: border-box; }
#gs-stick .gs-dot { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%); }
.gs-fx { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: transform, opacity; }
.gs-streak { width: 110px; height: 10px; margin: -5px 0 0 0; border-radius: 5px; transform-origin: 0 50%;
  background: linear-gradient(90deg, rgba(255,255,255,0), #fff 70%, #fff); box-shadow: 0 0 8px rgba(255,255,255,.8); }
.gs-ring-fx { width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 4px solid #fff; box-sizing: border-box; }
#gs-tutorial { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: rgba(20,14,40,.62);
  font-family: var(--font, system-ui, sans-serif); color: #fff; touch-action: none; -webkit-user-select: none; user-select: none;
  animation: gs-fade .25s ease-out; padding: 16px; box-sizing: border-box; }
#gs-tutorial[hidden] { display: none; }
#gs-tutorial h2 { margin: 0 0 14px; font-size: 34px; text-align: center; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.gs-cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 980px; }
.gs-card { width: 200px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.gs-pad { position: relative; width: 180px; height: 120px; border-radius: 18px; border: 3px solid rgba(255,255,255,.75); background: rgba(255,255,255,.1); overflow: hidden; }
.gs-pad::after { content: ''; position: absolute; left: 50%; top: 10px; bottom: 10px; border-left: 2px dashed rgba(255,255,255,.35); }
.gs-hand { position: absolute; font-size: 46px; line-height: 1; left: 50%; top: 50%; transform: translate(-50%,-30%); filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
.gs-cap { font-size: 24px; font-weight: 800; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
.gs-hint { margin-top: 18px; font-size: 22px; text-align: center; opacity: 0; transition: opacity .3s; }
#gs-tutorial.ready .gs-hint { opacity: .9; animation: gs-pulse 1.2s ease-in-out infinite; }
.gs-a-drag .gs-hand { left: 25%; animation: gs-drag 1.8s ease-in-out infinite; }
.gs-a-tap .gs-hand { left: 75%; animation: gs-tap 1.1s ease-in-out infinite; }
.gs-a-down .gs-hand { left: 75%; animation: gs-down 1.3s ease-in infinite; }
.gs-a-side .gs-hand { left: 75%; animation: gs-side 1.3s ease-in infinite; }
@keyframes gs-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes gs-pulse { 50% { opacity: .45; } }
@keyframes gs-drag { 0%,100% { transform: translate(-90%,-30%); } 50% { transform: translate(-10%,-60%); } }
@keyframes gs-tap { 0%,60%,100% { transform: translate(-50%,-30%) scale(1); } 30% { transform: translate(-50%,-20%) scale(.82); } }
@keyframes gs-down { 0% { transform: translate(-50%,-90%); opacity: 0; } 15% { opacity: 1; } 70% { transform: translate(-50%,10%); opacity: 1; } 100% { transform: translate(-50%,10%); opacity: 0; } }
@keyframes gs-side { 0% { transform: translate(-110%,-30%); opacity: 0; } 15% { opacity: 1; } 70% { transform: translate(10%,-30%); opacity: 1; } 100% { transform: translate(10%,-30%); opacity: 0; } }
html.reduce-motion .gs-hand { animation-duration: 3.6s !important; }
@media (prefers-reduced-motion: reduce) { .gs-hand { animation-duration: 3.6s !important; } }
